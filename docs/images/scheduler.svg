<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260"><title>Illustrative Tweet scheduler flow</title><rect width="900" height="260" fill="#f8fafc"/><g font-family="Arial" text-anchor="middle"><rect x="40" y="90" width="170" height="80" rx="12" fill="#dbeafe" stroke="#2563eb"/><text x="125" y="125">Rules</text><text x="125" y="148" font-size="13">date · days · window</text><path d="M210 130h70" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="280" y="90" width="170" height="80" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="365" y="125">Time slots</text><text x="365" y="148" font-size="13">blocked · interval</text><path d="M450 130h70" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="520" y="90" width="170" height="80" rx="12" fill="#ffedd5" stroke="#ea580c"/><text x="605" y="125">Queue</text><text x="605" y="148" font-size="13">capacity · skip ratio</text><path d="M690 130h70" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="760" y="90" width="100" height="80" rx="12" fill="#ede9fe" stroke="#7c3aed"/><text x="810" y="125">Accounts</text><text x="810" y="148" font-size="13">round-robin</text></g><defs><marker id="a" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0l8 4-8 4z" fill="#64748b"/></marker></defs></svg>
